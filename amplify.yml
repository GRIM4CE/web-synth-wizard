version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm config set cache .npm --location=project
        - npm ci --prefer-offline --no-audit --no-fund
    build:
      commands:
        - npm run build-only
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
  customHeaders:
    - pattern: '**/*.js'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.css'
      headers:
        - key: Cache-Control
          value: 'public, max-age=31536000, immutable'
    - pattern: index.html
      headers:
        - key: Cache-Control
          value: 'public, max-age=60, stale-while-revalidate=86400'
